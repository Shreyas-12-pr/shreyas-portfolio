<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07120b"/>
      <stop offset="50%" stop-color="#0a1a12"/>
      <stop offset="100%" stop-color="#040a06"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54f59b"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#54f59b"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(84, 245, 155, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radial highlight -->
  <circle cx="400" cy="225" r="280" fill="rgba(84, 245, 155, 0.06)" filter="url(#glow)"/>

  <!-- Workspace Window / Canvas -->
  <g transform="translate(80, 50)">
    <!-- Main Window Card -->
    <rect width="640" height="350" rx="14" fill="#0c1711" stroke="rgba(84, 245, 155, 0.25)" stroke-width="1.5"/>
    
    <!-- Topbar -->
    <rect width="640" height="40" rx="14" fill="#08100c"/>
    <rect y="30" width="640" height="10" fill="#08100c"/>
    <line x1="0" y1="40" x2="640" y2="40" stroke="rgba(84, 245, 155, 0.15)" stroke-width="1"/>
    
    <!-- Window controls -->
    <circle cx="24" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="20" r="5" fill="#27c93f"/>

    <text x="320" y="24" fill="#849b8c" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" text-anchor="middle" font-weight="500">
      Open Design AI · System Architecture Canvas
    </text>

    <!-- Sidebar Left -->
    <rect x="0" y="40" width="160" height="310" fill="#09140e"/>
    <line x1="160" y1="40" x2="160" y2="350" stroke="rgba(84, 245, 155, 0.12)" stroke-width="1"/>
    
    <!-- Sidebar Items -->
    <rect x="16" y="60" width="128" height="24" rx="6" fill="rgba(84, 245, 155, 0.12)"/>
    <text x="28" y="76" fill="#54f59b" font-family="monospace" font-size="11">❖ Tokens &amp; Grid</text>
    <rect x="16" y="94" width="128" height="24" rx="6" fill="transparent"/>
    <text x="28" y="110" fill="#849b8c" font-family="monospace" font-size="11">▦ UI Components</text>
    <rect x="16" y="128" width="128" height="24" rx="6" fill="transparent"/>
    <text x="28" y="144" fill="#849b8c" font-family="monospace" font-size="11">✦ AI Generator</text>
    <rect x="16" y="162" width="128" height="24" rx="6" fill="transparent"/>
    <text x="28" y="178" fill="#849b8c" font-family="monospace" font-size="11">⚡ Dynamic State</text>

    <!-- Canvas Inner Nodes -->
    <!-- Node 1: AI Prompt / Intent -->
    <g transform="translate(190, 75)">
      <rect width="180" height="90" rx="10" fill="#0e2016" stroke="rgba(84, 245, 155, 0.35)" stroke-width="1.2"/>
      <rect x="12" y="12" width="60" height="16" rx="4" fill="rgba(84, 245, 155, 0.15)"/>
      <text x="18" y="24" fill="#54f59b" font-family="monospace" font-size="9" font-weight="600">PROMPT</text>
      <text x="14" y="48" fill="#e0eee4" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500">Design Token Pipeline</text>
      <text x="14" y="68" fill="#829788" font-family="'Space Grotesk', sans-serif" font-size="10">AI-assisted component sync</text>
    </g>

    <!-- Connection Line 1 to 2 -->
    <path d="M 370 120 C 400 120, 400 190, 430 190" fill="none" stroke="#54f59b" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="400" cy="155" r="4" fill="#54f59b"/>

    <!-- Node 2: Design System Spec -->
    <g transform="translate(430, 140)">
      <rect width="180" height="110" rx="10" fill="#0d1f18" stroke="url(#cyanGrad)" stroke-width="1.5" filter="url(#glow)"/>
      <rect width="180" height="110" rx="10" fill="#0d1f18"/>
      <rect x="12" y="12" width="70" height="16" rx="4" fill="rgba(88, 166, 255, 0.18)"/>
      <text x="18" y="24" fill="#76e5cf" font-family="monospace" font-size="9" font-weight="600">SYSTEM CORE</text>
      <text x="14" y="50" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Reusable Components</text>
      <circle cx="24" cy="74" r="5" fill="#54f59b"/>
      <text x="36" y="78" fill="#a4c2ad" font-family="monospace" font-size="10">theme.tokens.css</text>
      <circle cx="24" cy="94" r="5" fill="#58a6ff"/>
      <text x="36" y="98" fill="#a4c2ad" font-family="monospace" font-size="10">button.variants.tsx</text>
    </g>

    <!-- Connection Line to Preview -->
    <path d="M 280 165 C 280 230, 310 250, 340 250" fill="none" stroke="rgba(84, 245, 155, 0.4)" stroke-width="1.5"/>

    <!-- Node 3: Live Output -->
    <g transform="translate(190, 210)">
      <rect width="190" height="100" rx="10" fill="#08140e" stroke="rgba(84, 245, 155, 0.2)" stroke-width="1"/>
      <text x="14" y="26" fill="#849b8c" font-family="monospace" font-size="10">LIVE COMPONENT PREVIEW</text>
      <!-- Mini button mockup -->
      <rect x="14" y="42" width="80" height="26" rx="6" fill="#54f59b"/>
      <text x="26" y="59" fill="#07120b" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600">Action ↗</text>
      <!-- Mini badge mockup -->
      <rect x="102" y="42" width="70" height="26" rx="6" fill="rgba(84, 245, 155, 0.1)" stroke="rgba(84, 245, 155, 0.3)"/>
      <text x="114" y="59" fill="#54f59b" font-family="monospace" font-size="10">Active</text>
      <!-- Status line -->
      <text x="14" y="88" fill="#54f59b" font-family="monospace" font-size="9">✓ 100% Token Compliant</text>
    </g>
  </g>
</svg>
